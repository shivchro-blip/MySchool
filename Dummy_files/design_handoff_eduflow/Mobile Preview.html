<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduFlow – Mobile Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #1a1d27 0%, #2d3250 50%, #1a1d27 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* Phone frame drawn with plain CSS/SVG — no dependency on ios-frame exports */
function PhoneFrame({ width = 390, height = 844, children }) {
  const bezelH = 14;   /* top/bottom bezel */
  const bezelV = 10;   /* left/right bezel */
  const outerW = width  + bezelV * 2;
  const outerH = height + bezelH * 2;
  const r = 52;        /* outer corner radius */
  const ri = 44;       /* inner corner radius */

  return (
    <div style={{ position: "relative", width: outerW, height: outerH, flexShrink: 0 }}>
      {/* Body */}
      <div style={{
        position: "absolute", inset: 0, borderRadius: r,
        background: "linear-gradient(160deg, #2a2a2e 0%, #1c1c1e 60%, #111 100%)",
        boxShadow: "0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.05)",
      }} />

      {/* Side buttons */}
      <div style={{ position:"absolute", left:-3, top:120, width:3, height:36, borderRadius:"2px 0 0 2px", background:"#3a3a3c" }} />
      <div style={{ position:"absolute", left:-3, top:168, width:3, height:64, borderRadius:"2px 0 0 2px", background:"#3a3a3c" }} />
      <div style={{ position:"absolute", left:-3, top:244, width:3, height:64, borderRadius:"2px 0 0 2px", background:"#3a3a3c" }} />
      <div style={{ position:"absolute", right:-3, top:160, width:3, height:80, borderRadius:"0 2px 2px 0", background:"#3a3a3c" }} />

      {/* Screen */}
      <div style={{
        position: "absolute", top: bezelH, left: bezelV,
        width, height, borderRadius: ri, overflow: "hidden",
        background: "#f0f2f8",
      }}>
        {/* Dynamic island */}
        <div style={{
          position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)",
          width: 120, height: 34, borderRadius: 20, background: "#000",
          zIndex: 10,
        }} />
        {/* Status bar */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 54,
          display: "flex", alignItems: "flex-end", justifyContent: "space-between",
          padding: "0 28px 6px", zIndex: 9, pointerEvents: "none",
        }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#1a1d27", fontFamily: "DM Sans, sans-serif" }}>9:41</span>
          <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
            {/* Signal bars */}
            <svg width="16" height="12" viewBox="0 0 16 12">
              {[2,5,8,11].map((x,i) => (
                <rect key={x} x={x} y={12-(i+1)*2.5} width="2.5" height={(i+1)*2.5} rx="0.8"
                  fill={i < 3 ? "#1a1d27" : "#9ca3af"} />
              ))}
            </svg>
            {/* WiFi */}
            <svg width="15" height="12" viewBox="0 0 15 12">
              <path d="M7.5 9.5 a0.8 0.8 0 1 1 0.001 0" fill="#1a1d27"/>
              <path d="M4.5 7a4.2 4.2 0 0 1 6 0" fill="none" stroke="#1a1d27" strokeWidth="1.2" strokeLinecap="round"/>
              <path d="M2 4.5a7.5 7.5 0 0 1 11 0" fill="none" stroke="#1a1d27" strokeWidth="1.2" strokeLinecap="round"/>
            </svg>
            {/* Battery */}
            <svg width="24" height="12" viewBox="0 0 24 12">
              <rect x="0" y="1" width="21" height="10" rx="2.5" fill="none" stroke="#1a1d27" strokeWidth="1.2"/>
              <rect x="21.5" y="4" width="2" height="4" rx="1" fill="#1a1d27"/>
              <rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="#1a1d27"/>
            </svg>
          </div>
        </div>

        {/* Content — padded for status bar */}
        <div style={{ position:"absolute", top:54, left:0, right:0, bottom:0, overflow:"hidden" }}>
          {children}
        </div>

        {/* Home indicator */}
        <div style={{
          position: "absolute", bottom: 8, left: "50%", transform: "translateX(-50%)",
          width: 134, height: 5, borderRadius: 3, background: "rgba(0,0,0,0.2)",
          zIndex: 10,
        }} />
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", minHeight: "100vh", gap: 24, padding: "24px 0",
    }}>
      {/* Title */}
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 24, fontWeight: 700, color: "#fff", letterSpacing: "-0.4px" }}>EduFlow</div>
        <div style={{ fontSize: 13, color: "rgba(255,255,255,0.45)", marginTop: 4 }}>Mobile Dashboard · iPhone 15 Pro</div>
      </div>

      {/* Phone */}
      <PhoneFrame width={390} height={780}>
        <iframe
          src="LearnDash.html"
          style={{ width: "390px", height: "780px", border: "none", display: "block" }}
          title="EduFlow Dashboard"
        />
      </PhoneFrame>

      {/* Hint */}
      <div style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", textAlign: "center", maxWidth: 300, lineHeight: 1.6 }}>
        Tap ☰ inside the phone to open the nav drawer<br/>
        Use the bottom tab bar to switch sections
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#1a1d27"/>
    <rect x="40" y="6" width="40" height="68" rx="9" fill="#2d3250"/>
    <rect x="43" y="14" width="34" height="54" rx="5" fill="#f0f2f8"/>
    <rect x="43" y="14" width="34" height="9" rx="3" fill="#2ec4b6" opacity="0.9"/>
    <rect x="43" y="27" width="34" height="14" rx="2" fill="#fff"/>
    <rect x="43" y="45" width="15" height="11" rx="2" fill="#9b72f0" opacity="0.7"/>
    <rect x="62" y="45" width="15" height="11" rx="2" fill="#fff"/>
    <rect x="43" y="60" width="34" height="6" rx="2" fill="#fff" opacity="0.6"/>
  </svg>
</template>
</body>
</html>
