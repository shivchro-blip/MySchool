<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English – Units</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: #f4efe9; color: #2a2118; }
  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #d8d0c8; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ── DATA ──────────────────────────────────────────────────── */
const UNITS = [
  { id: 1, title: "Unit 1", color: "#e8824a", light: "#fdf0e8", border: "#f0a97a",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "The Portrait of a Lady" },
      { type: "Poem",          tag: "poem",          title: "Once Upon a Time" },
      { type: "Supplementary", tag: "supplementary", title: "After Twenty Years" },
    ]},
  { id: 2, title: "Unit 2", color: "#5c8fd6", light: "#eaf2fd", border: "#8ab4e8",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "The Queen of Boxing" },
      { type: "Poem",          tag: "poem",          title: "Confessions of a Born Spectator" },
      { type: "Supplementary", tag: "supplementary", title: "A Shot in the Dark" },
    ]},
  { id: 3, title: "Unit 3", color: "#59a87a", light: "#e8f5ee", border: "#84c9a0",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "Forgetting" },
      { type: "Poem",          tag: "poem",          title: "Lines Written in the Early Spring" },
      { type: "Supplementary", tag: "supplementary", title: "The First Patient (play)" },
    ]},
  { id: 4, title: "Unit 4", color: "#a06cd5", light: "#f2ebfc", border: "#c49ee8",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "Tight Corners" },
      { type: "Poem",          tag: "poem",          title: "Macavity – The Mystery Cat" },
      { type: "Supplementary", tag: "supplementary", title: "With the Photographer" },
    ]},
  { id: 5, title: "Unit 5", color: "#d4873a", light: "#fdf3e7", border: "#e8b070",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "The Convocation Address" },
      { type: "Poem",          tag: "poem",          title: "Everest is not the Only Peak" },
      { type: "Supplementary", tag: "supplementary", title: "The Singing Lesson" },
    ]},
  { id: 6, title: "Unit 6", color: "#d45c6a", light: "#fdeaec", border: "#e88d97",
    subjects: [
      { type: "Prose",         tag: "prose",         title: "The Accidental Tourist" },
      { type: "Poem",          tag: "poem",          title: "The Hollow Crown" },
      { type: "Supplementary", tag: "supplementary", title: "The Never Never Nest (Play)" },
    ]},
];

const NAV_SUBJECTS = ["English", "Mathematics", "Science"];

/* ── ICONS ─────────────────────────────────────────────────── */
function IconBook({ size = 16, color }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
}
function IconPoem({ size = 16, color }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3c-4.97 0-9 3.186-9 7.115 0 2.557 1.522 4.82 3.889 6.115L6 21l4.447-2.724A10.39 10.39 0 0 0 12 18.23c4.97 0 9-3.185 9-7.115C21 6.186 16.97 3 12 3z"/></svg>;
}
function IconSupp({ size = 16, color }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>;
}
function IconChevron({ down, size = 16, color = "#9a8878" }) {
  return <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transform: down ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.25s ease" }}><polyline points="6 3 11 8 6 13"/></svg>;
}

function getIcon(tag, size, color) {
  if (tag === "prose") return <IconBook size={size} color={color} />;
  if (tag === "poem") return <IconPoem size={size} color={color} />;
  return <IconSupp size={size} color={color} />;
}

/* ── LESSON DETAIL PAGE ────────────────────────────────────── */
function LessonPage({ subject, unit, onBack }) {
  const [tab, setTab] = useState("overview");
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "32px 40px" }}>
      {/* Back breadcrumb */}
      <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", color: unit.color, fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, marginBottom: 28, padding: 0 }}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke={unit.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="10 3 5 8 10 13"/></svg>
        Back to {unit.title}
      </button>

      {/* Hero */}
      <div style={{ background: unit.light, border: `1.5px solid ${unit.border}`, borderRadius: 20, padding: "32px 36px", marginBottom: 28, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", right: -30, top: -30, width: 160, height: 160, borderRadius: "50%", background: `${unit.color}12` }}></div>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 18 }}>
          <div style={{ width: 52, height: 52, borderRadius: 14, background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, border: `1.5px solid ${unit.border}`, boxShadow: `0 4px 12px ${unit.color}22` }}>
            {getIcon(subject.tag, 24, unit.color)}
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: unit.color, marginBottom: 6 }}>{subject.type} · {unit.title}</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: "#2a2118", fontFamily: "'DM Serif Display', serif", lineHeight: 1.2, marginBottom: 10 }}>{subject.title}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setTab("overview")} style={{ padding: "8px 22px", borderRadius: 20, border: "none", cursor: "pointer", background: unit.color, color: "#fff", fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, letterSpacing: "0.02em" }}>Learn</button>
              <button onClick={() => setTab("practice")} style={{ padding: "8px 22px", borderRadius: 20, border: `1.5px solid ${unit.border}`, cursor: "pointer", background: "#fff", color: unit.color, fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600 }}>Practice</button>
            </div>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", gap: 4, background: "#ede8e0", borderRadius: 10, padding: 4, marginBottom: 24, width: "fit-content" }}>
        {["overview", "summary", "practice"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{ padding: "7px 18px", borderRadius: 8, border: "none", cursor: "pointer", background: tab === t ? "#fff" : "transparent", color: tab === t ? "#2a2118" : "#9a8878", fontWeight: tab === t ? 600 : 400, fontSize: 13, fontFamily: "'DM Sans', sans-serif", transition: "all 0.15s", boxShadow: tab === t ? "0 1px 4px #00000012" : "none" }}>{t.charAt(0).toUpperCase() + t.slice(1)}</button>
        ))}
      </div>

      {tab === "overview" && (
        <div style={{ maxWidth: 560 }}>
          <p style={{ fontSize: 14, color: "#7a6e60", lineHeight: 1.85, marginBottom: 24 }}>
            A richly layered piece exploring themes of memory, identity, and the human condition through vivid narrative and evocative language. This {subject.type.toLowerCase()} is part of the Tamil Nadu Board +1 English curriculum.
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {["Themes", "Characters", "Vocabulary", "Q & A"].map(chip => (
              <div key={chip} style={{ padding: "7px 16px", background: "#fff", border: "1.5px solid #e5ded6", borderRadius: 20, fontSize: 13, fontWeight: 500, color: "#5a4e3e", cursor: "pointer" }}>{chip}</div>
            ))}
          </div>
        </div>
      )}
      {tab === "summary" && (
        <div style={{ background: "#fff", border: "1.5px solid #e5ded6", borderRadius: 16, padding: "24px 28px", fontSize: 14, color: "#5a4e3e", lineHeight: 1.8, maxWidth: 560 }}>
          Select a section to view its summary. Detailed summaries, character notes, and chapter analyses are available for each part of this text.
        </div>
      )}
      {tab === "practice" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, maxWidth: 560 }}>
          {["Short Answer Questions", "Long Answer Questions", "Grammar Exercises", "Vocabulary Builder"].map((q, qi) => (
            <div key={qi} style={{ display: "flex", alignItems: "center", gap: 14, background: "#fff", border: "1.5px solid #e5ded6", borderRadius: 12, padding: "14px 18px", cursor: "pointer" }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: unit.light, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: unit.color }}>{qi + 1}</div>
              <span style={{ fontSize: 14, fontWeight: 500, color: "#2a2118", flex: 1 }}>{q}</span>
              <IconChevron color="#c5bdb5" size={14} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── SUBJECT ROW inside expanded unit card ─────────────────── */
function SubjectRow({ subject, unit, onOpen, index }) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        display: "flex", alignItems: "center", gap: 14,
        padding: "13px 18px",
        borderTop: "1px solid " + unit.border + "55",
        background: hov ? unit.light : "transparent",
        transition: "background 0.15s",
        animation: `slideDown 0.2s ease ${index * 0.05}s both`,
      }}
    >
      <div style={{ width: 34, height: 34, borderRadius: 9, background: unit.light, border: `1px solid ${unit.border}88`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        {getIcon(subject.tag, 16, unit.color)}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: unit.color, marginBottom: 1 }}>{subject.type}</div>
        <div style={{ fontSize: 14, fontWeight: 600, color: "#2a2118", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{subject.title}</div>
      </div>
      <div style={{ display: "flex", gap: 7, flexShrink: 0 }}>
        <button
          onClick={() => onOpen(subject, "learn")}
          style={{ padding: "6px 14px", borderRadius: 14, border: "none", background: unit.color, color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", transition: "opacity 0.15s", opacity: hov ? 1 : 0.85 }}
        >Learn</button>
        <button
          onClick={() => onOpen(subject, "practice")}
          style={{ padding: "6px 14px", borderRadius: 14, border: `1.5px solid ${unit.border}`, background: "#fff", color: unit.color, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans', sans-serif" }}
        >Practice</button>
      </div>
    </div>
  );
}

/* ── UNIT CARD ─────────────────────────────────────────────── */
function UnitCard({ unit, isOpen, onToggle, onOpenSubject }) {
  const [hov, setHov] = useState(false);
  return (
    <div style={{
      background: "#fff",
      border: `1.5px solid ${isOpen ? unit.border : hov ? unit.border + "88" : "#e5ded6"}`,
      borderRadius: 18,
      overflow: "hidden",
      transition: "border-color 0.2s, box-shadow 0.2s",
      boxShadow: isOpen ? `0 8px 32px ${unit.color}18` : hov ? `0 4px 16px ${unit.color}12` : "0 1px 4px #0000000a",
    }}>
      {/* Card header — click to expand */}
      <div
        onClick={onToggle}
        onMouseEnter={() => setHov(true)}
        onMouseLeave={() => setHov(false)}
        style={{
          display: "flex", alignItems: "center", gap: 16,
          padding: "18px 22px",
          cursor: "pointer",
          background: isOpen ? unit.light : "#fff",
          transition: "background 0.2s",
        }}
      >
        {/* Unit number badge */}
        <div style={{ width: 46, height: 46, borderRadius: 13, background: unit.color, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: `0 3px 10px ${unit.color}44` }}>
          <span style={{ color: "#fff", fontWeight: 800, fontSize: 15, fontFamily: "'DM Sans', sans-serif", letterSpacing: "-0.02em" }}>{unit.id}</span>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#2a2118", marginBottom: 3 }}>{unit.title}</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {unit.subjects.map(s => (
              <span key={s.tag} style={{ fontSize: 11, color: unit.color, background: unit.light, border: `1px solid ${unit.border}66`, borderRadius: 10, padding: "2px 8px", fontWeight: 500 }}>{s.type}</span>
            ))}
          </div>
        </div>
        <div style={{ flexShrink: 0 }}>
          <IconChevron down={isOpen} color={unit.color} size={18} />
        </div>
      </div>

      {/* Expanded subjects */}
      {isOpen && (
        <div>
          {unit.subjects.map((s, i) => (
            <SubjectRow key={s.tag} subject={s} unit={unit} onOpen={onOpenSubject} index={i} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ── MAIN APP ──────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "activeNav": "English",
  "showGrade": true,
  "accentColor": "#e8824a"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakSection, TweakToggle, TweakSelect } = window;

  const [openUnit, setOpenUnit] = useState(1);
  const [lessonView, setLessonView] = useState(null); // { subject, unit }

  const toggleUnit = (id) => setOpenUnit(prev => prev === id ? null : id);
  const openLesson = (subject, mode, unit) => setLessonView({ subject, unit, defaultTab: mode });

  return (
    <>
      <style>{`
        @keyframes slideDown {
          from { opacity: 0; transform: translateY(-6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
      `}</style>

      <div style={{ display: "flex", height: "100vh", width: "100vw", overflow: "hidden", background: "#f4efe9" }}>

        {/* ── SIDEBAR ──────────────────────────────────────── */}
        <div style={{ width: 210, flexShrink: 0, background: "#fff", borderRight: "1px solid #e8e2da", display: "flex", flexDirection: "column" }}>
          {/* Brand */}
          <div style={{ padding: "20px 20px 14px", borderBottom: "1px solid #f0ebe3" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#2a2118" }}>Tamil Nadu Board</div>
            <div style={{ fontSize: 11, color: "#9a8878", marginTop: 1 }}>State Syllabus</div>
          </div>

          {/* Grade pills */}
          {tweaks.showGrade && (
            <div style={{ padding: "12px 20px", display: "flex", gap: 6, borderBottom: "1px solid #f0ebe3" }}>
              {["+1", "+2"].map((g, gi) => (
                <div key={g} style={{ padding: "3px 12px", borderRadius: 20, background: gi === 0 ? "#2a2118" : "#ede8e0", color: gi === 0 ? "#fff" : "#7a6e60", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>{g}</div>
              ))}
            </div>
          )}

          {/* Subject nav */}
          <div style={{ flex: 1, overflowY: "auto", paddingTop: 8 }}>
            {NAV_SUBJECTS.map(nav => {
              const isActive = nav === "English";
              return (
                <div key={nav} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 20px", background: isActive ? "#f4efe9" : "transparent", borderLeft: `3px solid ${isActive ? "#2a2118" : "transparent"}`, cursor: "pointer" }}>
                  <span style={{ fontSize: 13, fontWeight: isActive ? 600 : 400, color: isActive ? "#2a2118" : "#7a6e60" }}>{nav}</span>
                  {isActive && <IconChevron color="#9a8878" size={13} />}
                </div>
              );
            })}
          </div>
        </div>

        {/* ── MAIN AREA ─────────────────────────────────────── */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

          {lessonView ? (
            <LessonPage subject={lessonView.subject} unit={lessonView.unit} onBack={() => setLessonView(null)} />
          ) : (
            <div style={{ flex: 1, overflowY: "auto", padding: "36px 40px" }}>
              {/* Header */}
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, fontSize: 13, color: "#9a8878" }}>
                <span>+1</span>
                <span>›</span>
                <span style={{ color: "#2a2118", fontWeight: 500 }}>English</span>
              </div>
              <h1 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 28, fontWeight: 400, color: "#2a2118", marginBottom: 4 }}>English</h1>
              <p style={{ fontSize: 13, color: "#9a8878", marginBottom: 32 }}>Select a unit to explore its lessons</p>

              {/* 6 unit cards */}
              <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 680 }}>
                {UNITS.map(unit => (
                  <UnitCard
                    key={unit.id}
                    unit={unit}
                    isOpen={openUnit === unit.id}
                    onToggle={() => toggleUnit(unit.id)}
                    onOpenSubject={(subject, mode) => openLesson(subject, mode, unit)}
                  />
                ))}
              </div>
            </div>
          )}
        </div>

        {/* ── TWEAKS ───────────────────────────────────────── */}
        <TweaksPanel>
          <TweakSection label="Display">
            <TweakToggle id="showGrade" label="Show grade pills" />
          </TweakSection>
        </TweaksPanel>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
