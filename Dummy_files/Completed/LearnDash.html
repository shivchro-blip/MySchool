<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduFlow – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; }
  button, input, select { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d4e8; border-radius: 10px; }

  /* Mobile drawer overlay */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  /* Mobile drawer */
  .mobile-drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 240px; z-index: 101;
    transform: translateX(-100%);
    transition: transform .25s ease;
  }
  .mobile-drawer.open { transform: translateX(0); }

  /* Bottom nav (mobile) */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 64px; background: #fff;
    border-top: 1px solid #eef0f7;
    display: flex; align-items: center; justify-content: space-around;
    z-index: 90; padding: 0 8px;
  }

  /* Responsive table — hide cols on small screens */
  @media (max-width: 600px) {
    .col-hide-sm { display: none !important; }
  }
  @media (max-width: 820px) {
    .col-hide-md { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── Tweak defaults ───────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentTeal":   "#2ec4b6",
  "accentViolet": "#9b72f0",
  "accentCoral":  "#ff6b6b",
  "sidebarBg":    "#1a1d27",
  "cardRadius":   14
}/*EDITMODE-END*/;

/* ── Breakpoints ─────────────────────────────────────────────────────────── */
const BP = { sm: 640, md: 900, lg: 1200 };

function useWindowWidth() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return w;
}

/* ── Icons ───────────────────────────────────────────────────────────────── */
function Icon({ name, size = 18, color = "currentColor", strokeWidth = 1.7 }) {
  const p = {
    dashboard:   <><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
    courses:     <><path d="M4 19V5a2 2 0 012-2h12a2 2 0 012 2v14"/><path d="M4 19h16"/><path d="M9 7h6M9 11h6"/></>,
    assignments: <><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></>,
    progress:    <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></>,
    messages:    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>,
    settings:    <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></>,
    logout:      <><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
    search:      <><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    bell:        <><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
    chevronR:    <polyline points="9,18 15,12 9,6"/>,
    chevronL:    <polyline points="15,18 9,12 15,6"/>,
    book:        <><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></>,
    certificate: <><circle cx="12" cy="8" r="5"/><path d="M12 13v8"/><path d="M9 18l3 3 3-3"/></>,
    database:    <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>,
    globe:       <><circle cx="12" cy="12" r="9"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></>,
    palette:     <><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.1 0 2-.9 2-2v-.5c0-.55-.45-1-1-1H12c-2.76 0-5-2.24-5-5S9.24 7 12 7c2.76 0 5 2.24 5 5v1c0 .55.45 1 1 1s1-.45 1-1v-1c0-5.52-4.48-10-10-10z"/></>,
    menu:        <><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></>,
    x:           <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {p[name] || null}
    </svg>
  );
}

/* ── Avatar ──────────────────────────────────────────────────────────────── */
function Avatar({ initials, size = 36, bg = "#7c6fcd", color = "#fff", xStyle = {} }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: bg, flexShrink: 0,
      display: "flex", alignItems: "center", justifyContent: "center",
      color, fontWeight: 600, fontSize: size * 0.36, ...xStyle }}>
      {initials}
    </div>
  );
}

/* ── Stat Card ───────────────────────────────────────────────────────────── */
function StatCard({ icon, value, label, accent, radius }) {
  const [hov, setHov] = useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ flex: 1, minWidth: 0, background: accent, borderRadius: radius,
        padding: "18px 20px", display: "flex", flexDirection: "column", gap: 8,
        position: "relative", overflow: "hidden", cursor: "pointer",
        transition: "transform .18s, box-shadow .18s",
        transform: hov ? "translateY(-2px)" : "none",
        boxShadow: hov ? `0 12px 28px ${accent}66` : `0 4px 16px ${accent}44`,
      }}>
      <div style={{ position:"absolute", right:-16, top:-16, width:80, height:80, borderRadius:"50%", background:"rgba(255,255,255,0.12)" }} />
      <div style={{ position:"absolute", right:16, bottom:-24, width:60, height:60, borderRadius:"50%", background:"rgba(255,255,255,0.08)" }} />
      <div style={{ width:36, height:36, borderRadius:9, background:"rgba(255,255,255,0.22)", display:"flex", alignItems:"center", justifyContent:"center" }}>
        <Icon name={icon} size={18} color="#fff" strokeWidth={2} />
      </div>
      <div>
        <div style={{ fontSize:26, fontWeight:700, color:"#fff", lineHeight:1 }}>{value}</div>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.85)", marginTop:3, fontWeight:500 }}>{label}</div>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:3 }}>
        <span style={{ fontSize:11, color:"rgba(255,255,255,0.9)", fontWeight:500 }}>View Details</span>
        <Icon name="chevronR" size={12} color="rgba(255,255,255,0.9)" strokeWidth={2.5} />
      </div>
    </div>
  );
}

/* ── Status Badge ────────────────────────────────────────────────────────── */
function StatusBadge({ status }) {
  const map = {
    "Live":        { bg:"#fff0f0", color:"#e53e3e", dot:"#e53e3e" },
    "In Progress": { bg:"#e8f4fd", color:"#2b6cb0", dot:"#4299e1" },
    "Completed":   { bg:"#f0fff4", color:"#276749", dot:"#48bb78" },
    "Pending":     { bg:"#fffaf0", color:"#c05621", dot:"#ed8936" },
  };
  const s = map[status] || map["Pending"];
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:5, padding:"4px 10px",
      borderRadius:20, background:s.bg, color:s.color, fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>
      <svg width="7" height="7" viewBox="0 0 7 7"><circle cx="3.5" cy="3.5" r="3.5" fill={s.dot}/></svg>
      {status}
    </span>
  );
}

/* ── Bar Chart ───────────────────────────────────────────────────────────── */
function BarChart({ accent }) {
  const data = [
    { day:"Mon", val:6.2 }, { day:"Tue", val:7.8 },
    { day:"Wed", val:9.15 }, { day:"Thu", val:7.0 }, { day:"Fri", val:5.5 },
  ];
  const [hov, setHov] = useState(null);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:8, height:80 }}>
      {data.map((d, i) => {
        const pct = (d.val / 10) * 100;
        const h = hov === i;
        return (
          <div key={d.day} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4, height:"100%" }}
            onMouseEnter={() => setHov(i)} onMouseLeave={() => setHov(null)}>
            <div style={{ flex:1, width:"100%", display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
              {h && <div style={{ textAlign:"center", fontSize:10, fontWeight:700, color:accent, marginBottom:2 }}>{d.val}h</div>}
              <div style={{ width:"100%", height:`${pct}%`, borderRadius:5,
                background: h ? accent : `${accent}55`, transition:"background .2s" }} />
            </div>
            <div style={{ fontSize:10, color:"#9ca3af", fontWeight:500 }}>{d.day}</div>
          </div>
        );
      })}
    </div>
  );
}

/* ── Donut Chart ─────────────────────────────────────────────────────────── */
function DonutChart({ pct, accent, size = 160 }) {
  const r = size * 0.38, cx = size / 2, cy = size / 2, sw = 10;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#eef0f7" strokeWidth={sw} />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={accent} strokeWidth={sw}
        strokeDasharray={`${dash} ${circ - dash}`}
        strokeDashoffset={circ / 4} strokeLinecap="round" />
      <text x={cx} y={cy - 5} textAnchor="middle" fill="#1a1d27"
        fontSize={size * 0.15} fontWeight="700" fontFamily="DM Sans, sans-serif">{pct}%</text>
      <text x={cx} y={cy + size * 0.1} textAnchor="middle" fill="#9ca3af"
        fontSize={size * 0.072} fontFamily="DM Sans, sans-serif">Progress</text>
    </svg>
  );
}

/* ── Mini Calendar ───────────────────────────────────────────────────────── */
function MiniCalendar({ accent }) {
  const [mo, setMo] = useState(new Date(2024, 4, 1));
  const todayD = 15;
  const mNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const week = [13,14,15,16,17];
  const labels = ["Mon","Tue","Wed","Thu","Fri"];
  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
        <span style={{ fontWeight:600, fontSize:13, color:"#1a1d27" }}>{mNames[mo.getMonth()]} {mo.getFullYear()}</span>
        <div style={{ display:"flex", gap:4 }}>
          {[["chevronL",-1],["chevronR",1]].map(([ic,d]) => (
            <button key={ic} onClick={() => setMo(m => new Date(m.getFullYear(), m.getMonth()+d, 1))}
              style={{ width:26, height:26, borderRadius:6, border:"1.5px solid #eef0f7", background:"#fff",
                cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon name={ic} size={13} color="#6b7280" strokeWidth={2} />
            </button>
          ))}
        </div>
      </div>
      <div style={{ display:"flex" }}>
        {labels.map((lbl, i) => (
          <div key={lbl} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:5 }}>
            <div style={{ fontSize:10, color:"#9ca3af", fontWeight:500 }}>{lbl}</div>
            <div style={{ width:30, height:30, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center",
              background: week[i] === todayD ? accent : "transparent",
              color: week[i] === todayD ? "#fff" : "#374151",
              fontWeight: week[i] === todayD ? 700 : 400, fontSize:13, cursor:"pointer" }}>
              {week[i]}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Sidebar Nav List (reused in desktop + mobile drawer) ────────────────── */
function SidebarNav({ activeNav, setActiveNav, accentTeal, sidebarBg, collapsed, onClose }) {
  const navItems = [
    { id:"dashboard",   icon:"dashboard",   label:"Dashboard"   },
    { id:"courses",     icon:"courses",     label:"Courses"     },
    { id:"assignments", icon:"assignments", label:"Assignments" },
    { id:"progress",    icon:"progress",    label:"Progress"    },
    { id:"activity",    icon:"progress",    label:"Activity"    },
    { id:"certificate", icon:"certificate", label:"Certificate" },
    { id:"messages",    icon:"messages",    label:"Messages"    },
  ];
  return (
    <div style={{ width:"100%", height:"100%", background:sidebarBg,
      display:"flex", flexDirection:"column", padding:"0 0 20px" }}>
      {/* Logo row */}
      <div style={{ padding:"18px 16px 14px", display:"flex", alignItems:"center",
        gap:10, borderBottom:"1px solid rgba(255,255,255,0.07)", marginBottom:6 }}>
        <div style={{ width:34, height:34, borderRadius:9, background:accentTeal, flexShrink:0,
          display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon name="book" size={18} color="#fff" strokeWidth={2} />
        </div>
        {!collapsed && <span style={{ color:"#fff", fontWeight:700, fontSize:16, whiteSpace:"nowrap", flex:1 }}>EduFlow</span>}
        {onClose && (
          <button onClick={onClose} style={{ border:"none", background:"transparent", cursor:"pointer",
            display:"flex", padding:4, borderRadius:6 }}>
            <Icon name="x" size={18} color="rgba(255,255,255,0.5)" />
          </button>
        )}
      </div>
      {/* Nav items */}
      <nav style={{ flex:1, display:"flex", flexDirection:"column", gap:2, padding:"4px 10px" }}>
        {navItems.map(item => {
          const active = activeNav === item.id;
          return (
            <button key={item.id}
              onClick={() => { setActiveNav(item.id); onClose && onClose(); }}
              style={{ display:"flex", alignItems:"center", gap:12,
                padding: collapsed ? "11px 0" : "10px 12px",
                justifyContent: collapsed ? "center" : "flex-start",
                borderRadius:10, border:"none", cursor:"pointer",
                background: active ? `${accentTeal}22` : "transparent",
                color: active ? accentTeal : "rgba(255,255,255,0.5)",
                fontFamily:"DM Sans, sans-serif", fontWeight: active ? 600 : 400, fontSize:14,
                whiteSpace:"nowrap", transition:"background .15s, color .15s",
              }}>
              <Icon name={item.icon} size={18} color={active ? accentTeal : "rgba(255,255,255,0.5)"} />
              {!collapsed && item.label}
            </button>
          );
        })}
      </nav>
      {/* Bottom nav */}
      {!collapsed && (
        <div style={{ display:"flex", flexDirection:"column", gap:2, padding:"0 10px" }}>
          {[{icon:"settings",label:"Settings"},{icon:"logout",label:"Log out"}].map(item => (
            <button key={item.icon} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px",
              borderRadius:10, border:"none", cursor:"pointer", background:"transparent",
              color:"rgba(255,255,255,0.4)", fontFamily:"DM Sans, sans-serif", fontSize:14,
              whiteSpace:"nowrap" }}>
              <Icon name={item.icon} size={18} color="rgba(255,255,255,0.4)" />
              {item.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Main App ────────────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakSection, TweakColor, TweakSlider } = window;

  const { accentTeal, accentViolet, accentCoral, sidebarBg, cardRadius: cr } = tweaks;

  const vw = useWindowWidth();
  const isMobile = vw < BP.sm;
  const isTablet = vw >= BP.sm && vw < BP.md;
  const isDesktop = vw >= BP.md;

  const [activeNav, setActiveNav] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(true);   // desktop collapse
  const [drawerOpen, setDrawerOpen] = useState(false);    // mobile drawer

  // Close drawer on resize to desktop
  useEffect(() => { if (isDesktop) setDrawerOpen(false); }, [isDesktop]);

  const gap = isMobile ? 12 : 18;

  const courses = [
    { name:"Data Accessibility", lessons:30, duration:"20 hrs", instructor:"Alex Hills",  initials:"AH", status:"Live"       },
    { name:"UX Research",        lessons:20, duration:"18 hrs", instructor:"Wills Cr.",   initials:"WC", status:"In Progress" },
    { name:"Figma Basics",       lessons:15, duration:"12 hrs", instructor:"Willy F.",    initials:"WF", status:"Completed"   },
    { name:"Content Writing",    lessons:12, duration:"10 hrs", instructor:"Wegsy P.",    initials:"WP", status:"Pending"     },
  ];

  const assignments = [
    { icon:"database", name:"Data Collections", date:"2 July, 10:30 AM",  color:accentViolet },
    { icon:"globe",    name:"Market Research",  date:"14 June, 12:45 AM", color:accentTeal   },
    { icon:"palette",  name:"Color Theory",     date:"14 June, 12:45 AM", color:accentCoral  },
  ];

  const upcoming = [
    { time:"10:30 AM", title:"Usability Testing", sub:"Online – Zoom Meet", ac:accentViolet },
    { time:"12:30 PM", title:"UX Research",        sub:"Online – Zoom Meet", ac:accentTeal   },
  ];

  /* ── layout helpers ── */
  const bodyPad = isMobile ? 14 : 20;

  return (
    <div style={{ display:"flex", height:"100vh", overflow:"hidden", background:"#f0f2f8" }}>

      {/* ── Desktop Sidebar ── */}
      {isDesktop && (
        <aside style={{ width: sidebarOpen ? 200 : 64, flexShrink:0,
          transition:"width .25s ease", overflow:"hidden" }}>
          <SidebarNav activeNav={activeNav} setActiveNav={setActiveNav}
            accentTeal={accentTeal} sidebarBg={sidebarBg}
            collapsed={!sidebarOpen} onClose={null} />
        </aside>
      )}

      {/* ── Mobile Drawer overlay ── */}
      {!isDesktop && (
        <>
          <div className={`drawer-overlay ${drawerOpen ? "open" : ""}`} onClick={() => setDrawerOpen(false)} />
          <div className={`mobile-drawer ${drawerOpen ? "open" : ""}`} style={{ width:240 }}>
            <SidebarNav activeNav={activeNav} setActiveNav={setActiveNav}
              accentTeal={accentTeal} sidebarBg={sidebarBg}
              collapsed={false} onClose={() => setDrawerOpen(false)} />
          </div>
        </>
      )}

      {/* ── Right: Header + Body ── */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* Header */}
        <header style={{ background:"#fff", height:58, padding:`0 ${bodyPad}px`, flexShrink:0,
          display:"flex", alignItems:"center", justifyContent:"space-between",
          borderBottom:"1px solid #eef0f7" }}>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <button onClick={() => isDesktop ? setSidebarOpen(o => !o) : setDrawerOpen(o => !o)}
              style={{ border:"none", background:"transparent", cursor:"pointer",
                padding:6, borderRadius:8, display:"flex" }}>
              <Icon name="menu" size={20} color="#6b7280" />
            </button>
            {!isMobile && (
              <div>
                <span style={{ fontSize:16, fontWeight:400, color:"#374151" }}>Welcome back, </span>
                <span style={{ fontSize:16, fontWeight:700, color:accentTeal }}>Alex!</span>
              </div>
            )}
            {isMobile && (
              <div style={{ width:30, height:30, borderRadius:9, background:accentTeal,
                display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Icon name="book" size={16} color="#fff" strokeWidth={2} />
              </div>
            )}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap: isMobile ? 10 : 14 }}>
            {!isMobile && (
              <div style={{ display:"flex", alignItems:"center", gap:7, background:"#f5f6fa",
                borderRadius:10, padding:"6px 12px", border:"1.5px solid #eef0f7" }}>
                <Icon name="search" size={14} color="#9ca3af" />
                <input placeholder="Search…" style={{ border:"none", background:"transparent",
                  outline:"none", fontSize:13, color:"#374151", width: isTablet ? 90 : 130 }} />
              </div>
            )}
            {isMobile && (
              <button style={{ border:"none", background:"transparent", cursor:"pointer", display:"flex", padding:4 }}>
                <Icon name="search" size={20} color="#6b7280" />
              </button>
            )}
            <div style={{ position:"relative", cursor:"pointer" }}>
              <Icon name="bell" size={20} color="#6b7280" />
              <div style={{ position:"absolute", top:-2, right:-2, width:8, height:8, borderRadius:"50%",
                background:accentCoral, border:"2px solid #fff" }} />
            </div>
            <Avatar initials="AW" size={32} bg={accentViolet} />
            {!isMobile && (
              <div>
                <div style={{ fontSize:12, fontWeight:600, color:"#374151" }}>Alex Wattsberg</div>
                <div style={{ fontSize:10, color:"#9ca3af" }}>Student</div>
              </div>
            )}
          </div>
        </header>

        {/* Scrollable body */}
        <div style={{ flex:1, overflow:"auto", padding:`${bodyPad}px`,
          paddingBottom: (!isDesktop) ? 80 : bodyPad,
          display:"flex", flexDirection:"column", gap }}>

          {/* ── Mobile welcome ── */}
          {isMobile && activeNav === "dashboard" && (
            <div>
              <span style={{ fontSize:17, fontWeight:400, color:"#374151" }}>Welcome back, </span>
              <span style={{ fontSize:17, fontWeight:700, color:accentTeal }}>Alex!</span>
            </div>
          )}

          {/* ══ ACTIVITY PAGE ══ */}
          {activeNav === "activity" && (
            <div style={{ display:"flex", flexDirection:"column", gap }}>
              <h2 style={{ fontSize:18, fontWeight:700, color:"#1a1d27" }}>Activity</h2>
              <div style={{ background:"#fff", borderRadius:cr, padding:"22px 24px", boxShadow:"0 2px 12px rgba(0,0,0,0.05)" }}>
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:10, marginBottom:20 }}>
                  <div style={{ width:72, height:72, borderRadius:"50%",
                    background:`linear-gradient(135deg, ${accentTeal}, ${accentViolet})`,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:24, fontWeight:700, color:"#fff",
                    border:"3px solid #fff", boxShadow:"0 4px 20px rgba(0,0,0,0.14)" }}>AW</div>
                  <div style={{ fontWeight:700, fontSize:16, color:"#1a1d27" }}>Alex Wattsberg</div>
                  <div style={{ fontSize:12, color:"#9ca3af" }}>Active Learner</div>
                </div>
                <div style={{ display:"flex", gap:16, justifyContent:"center", marginBottom:24 }}>
                  {[["20","Courses"],["65%","Progress"],["9h","This Week"]].map(([val, lbl]) => (
                    <div key={lbl} style={{ textAlign:"center", padding:"12px 20px", borderRadius:12, background:"#f5f6fa" }}>
                      <div style={{ fontSize:22, fontWeight:700, color:accentTeal }}>{val}</div>
                      <div style={{ fontSize:11, color:"#9ca3af", marginTop:2 }}>{lbl}</div>
                    </div>
                  ))}
                </div>
                <h4 style={{ fontSize:13, fontWeight:700, color:"#1a1d27", marginBottom:12 }}>Weekly Hours</h4>
                <BarChart accent={accentViolet} />
                <div style={{ marginTop:6, textAlign:"right", fontSize:11, color:"#10b981", fontWeight:600 }}>+5% increase this week</div>
              </div>
            </div>
          )}

          {/* ══ CERTIFICATE PAGE ══ */}
          {activeNav === "certificate" && (
            <div style={{ display:"flex", flexDirection:"column", gap }}>
              <h2 style={{ fontSize:18, fontWeight:700, color:"#1a1d27" }}>Certificates</h2>
              <div style={{ display:"flex", flexDirection: isMobile ? "column" : "row", gap, flexWrap:"wrap" }}>
                {[
                  { name:"Figma Basics",       date:"Apr 2024", accent:accentTeal   },
                  { name:"UX Research",         date:"Mar 2024", accent:accentViolet },
                  { name:"Data Accessibility",  date:"Feb 2024", accent:accentCoral  },
                ].map((cert, i) => (
                  <div key={i} style={{ flex:1, minWidth:220, background:"#fff", borderRadius:cr,
                    padding:"24px", boxShadow:"0 2px 16px rgba(0,0,0,0.07)", position:"relative", overflow:"hidden", cursor:"pointer" }}>
                    <div style={{ position:"absolute", right:-20, top:-20, width:100, height:100,
                      borderRadius:"50%", background:`${cert.accent}15` }} />
                    <div style={{ width:48, height:48, borderRadius:12, background:`${cert.accent}22`,
                      display:"flex", alignItems:"center", justifyContent:"center", marginBottom:14 }}>
                      <Icon name="certificate" size={24} color={cert.accent} strokeWidth={1.8} />
                    </div>
                    <div style={{ fontSize:15, fontWeight:700, color:"#1a1d27", marginBottom:4 }}>{cert.name}</div>
                    <div style={{ fontSize:12, color:"#9ca3af", marginBottom:14 }}>Issued {cert.date}</div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <div style={{ height:5, flex:1, borderRadius:10, background:"#eef0f7" }}>
                        <div style={{ width:"100%", height:"100%", borderRadius:10, background:cert.accent }} />
                      </div>
                      <span style={{ fontSize:11, fontWeight:600, color:cert.accent }}>Completed</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ══ PROGRESS PAGE ══ */}
          {activeNav === "progress" && (
            <div style={{ display:"flex", flexDirection:"column", gap }}>
              <h2 style={{ fontSize:18, fontWeight:700, color:"#1a1d27" }}>Progress</h2>
              <div style={{ display:"flex", gap, flexDirection: isMobile ? "column" : "row" }}>
                <div style={{ flex:1, background:"#fff", borderRadius:cr, padding:"22px 24px",
                  boxShadow:"0 2px 12px rgba(0,0,0,0.05)", display:"flex", flexDirection:"column", alignItems:"center" }}>
                  <DonutChart pct={65} accent={accentTeal} size={isMobile ? 150 : 180} />
                  <p style={{ fontSize:13, color:"#9ca3af", textAlign:"center", marginTop:8, lineHeight:1.6 }}>
                    Overall course completion
                  </p>
                </div>
                <div style={{ flex:2, background:"#fff", borderRadius:cr, padding:"22px 24px",
                  boxShadow:"0 2px 12px rgba(0,0,0,0.05)" }}>
                  <h4 style={{ fontSize:14, fontWeight:700, color:"#1a1d27", marginBottom:16 }}>Course Progress</h4>
                  <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                    {[
                      { name:"Data Accessibility", pct:85, accent:accentTeal   },
                      { name:"UX Research",         pct:60, accent:accentViolet },
                      { name:"Figma Basics",         pct:100,accent:accentCoral  },
                      { name:"Content Writing",      pct:30, accent:"#f59e0b"   },
                    ].map((c, i) => (
                      <div key={i}>
                        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                          <span style={{ fontSize:13, fontWeight:500, color:"#1a1d27" }}>{c.name}</span>
                          <span style={{ fontSize:12, fontWeight:600, color:c.accent }}>{c.pct}%</span>
                        </div>
                        <div style={{ height:7, borderRadius:10, background:"#eef0f7" }}>
                          <div style={{ width:`${c.pct}%`, height:"100%", borderRadius:10, background:c.accent, transition:"width .5s ease" }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ══ DASHBOARD (default) ══ */}
          {(activeNav === "dashboard" || activeNav === "courses" || activeNav === "assignments" || activeNav === "messages") && (
            <>

          {/* ── Stat cards — always a row, scroll on tiny screens ── */}
          <div style={{ display:"flex", gap, overflowX: isMobile ? "auto" : "visible",
            paddingBottom: isMobile ? 4 : 0 }}>
            <div style={{ display:"flex", gap, flexShrink:0, width: isMobile ? "max-content" : "100%" }}>
              <StatCard icon="book"        value="20" label="Enrolled Courses" accent={accentTeal}   radius={cr} />
              <StatCard icon="assignments" value="20" label="Lessons"          accent={accentViolet} radius={cr} />
            </div>
          </div>

          {/* ── Main content columns ── */}
          <div style={{ display:"flex", gap, flexDirection: isDesktop ? "row" : "column", alignItems:"flex-start" }}>

            {/* Centre column */}
            <div style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column", gap }}>

              {/* Assignments + Progress */}
              <div style={{ display:"flex", gap, flexDirection: isMobile ? "column" : "row" }}>

                {/* Assignments */}
                <div style={{ flex:1, background:"#fff", borderRadius:cr, padding:"18px 20px",
                  boxShadow:"0 2px 12px rgba(0,0,0,0.05)" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                    <h3 style={{ fontSize:15, fontWeight:700, color:"#1a1d27" }}>Assignments</h3>
                    <button style={{ fontSize:12, color:accentTeal, fontWeight:600, border:"none",
                      background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", gap:2 }}>
                      View All <Icon name="chevronR" size={12} color={accentTeal} strokeWidth={2.5} />
                    </button>
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                    {assignments.map((a, i) => (
                      <div key={i} style={{ display:"flex", alignItems:"center", gap:12,
                        padding:"11px 12px", borderRadius:10, border:"1.5px solid #f3f4f6",
                        cursor:"pointer", transition:"border-color .15s, background .15s" }}
                        onMouseEnter={e => { e.currentTarget.style.borderColor = a.color+"55"; e.currentTarget.style.background = a.color+"0a"; }}
                        onMouseLeave={e => { e.currentTarget.style.borderColor = "#f3f4f6"; e.currentTarget.style.background = "transparent"; }}>
                        <div style={{ width:36, height:36, borderRadius:9, background:a.color+"22",
                          display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                          <Icon name={a.icon} size={17} color={a.color} />
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:600, color:"#1a1d27" }}>{a.name}</div>
                          <div style={{ fontSize:11, color:"#9ca3af", marginTop:2 }}>{a.date}</div>
                        </div>
                        <Icon name="chevronR" size={13} color="#d1d5db" strokeWidth={2} />
                      </div>
                    ))}
                  </div>
                </div>

                {/* Progress donut */}
                <div style={{ flex:1, background:"#fff", borderRadius:cr, padding:"18px 20px",
                  boxShadow:"0 2px 12px rgba(0,0,0,0.05)", display:"flex", flexDirection:"column" }}>
                  <h3 style={{ fontSize:15, fontWeight:700, color:"#1a1d27", marginBottom:8 }}>Progress</h3>
                  <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8 }}>
                    <DonutChart pct={65} accent={accentTeal} size={isMobile ? 140 : 160} />
                    <p style={{ fontSize:12, color:"#9ca3af", textAlign:"center", lineHeight:1.5 }}>
                      Keep improving the quality<br/>of your learning
                    </p>
                  </div>
                </div>

              </div>
            </div>

            {/* ── Right column (desktop only inline; mobile appended below) ── */}
            <div style={{ width: isDesktop ? 248 : "100%", flexShrink:0,
              display:"flex", flexDirection: isMobile ? "column" : isTablet ? "row" : "column", gap }}>

              {/* Activity card */}
              <div style={{ flex:1, background:"#fff", borderRadius:cr, padding:"18px 20px",
                boxShadow:"0 2px 12px rgba(0,0,0,0.05)" }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                  <h3 style={{ fontSize:15, fontWeight:700, color:"#1a1d27" }}>Activity</h3>
                  <div style={{ width:26, height:26, borderRadius:7, border:"1.5px solid #eef0f7",
                    display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
                    <span style={{ fontSize:14, color:"#9ca3af" }}>⋯</span>
                  </div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8, marginBottom:16 }}>
                  <div style={{ width:58, height:58, borderRadius:"50%",
                    background:`linear-gradient(135deg, ${accentTeal}, ${accentViolet})`,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:18, fontWeight:700, color:"#fff",
                    border:"3px solid #fff", boxShadow:"0 4px 14px rgba(0,0,0,0.12)" }}>AW</div>
                  <div style={{ fontWeight:700, fontSize:14, color:"#1a1d27" }}>Alex Wattsberg</div>
                </div>
                <div>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:8 }}>
                    <div>
                      <div style={{ fontSize:12, fontWeight:700, color:"#1a1d27" }}>Hours Activity</div>
                      <div style={{ fontSize:10, color:"#10b981", fontWeight:600, marginTop:1 }}>+5% increase this week</div>
                    </div>
                    <span style={{ fontSize:10, color:"#9ca3af" }}>9:15 Min</span>
                  </div>
                  <BarChart accent={accentViolet} />
                </div>
              </div>



            </div>
          </div>
          {/* ══ END DASHBOARD ══ */}
          </>
          )}

        </div>
      </div>

      {/* ── Mobile Bottom Nav ── */}
      {!isDesktop && (
        <nav className="bottom-nav">
          {[
            { id:"dashboard",   icon:"dashboard",   label:"Home"        },
            { id:"courses",     icon:"courses",     label:"Courses"     },
            { id:"assignments", icon:"assignments", label:"Tasks"       },
            { id:"activity",    icon:"progress",    label:"Activity"    },
            { id:"certificate", icon:"certificate", label:"Certificate" },
          ].map(item => {
            const active = activeNav === item.id;
            return (
              <button key={item.id} onClick={() => setActiveNav(item.id)} style={{
                display:"flex", flexDirection:"column", alignItems:"center", gap:3,
                border:"none", background:"transparent", cursor:"pointer", padding:"6px 10px",
                borderRadius:10, color: active ? accentTeal : "#9ca3af",
                fontFamily:"DM Sans, sans-serif", fontSize:10, fontWeight: active ? 600 : 400,
                transition:"color .15s",
              }}>
                <Icon name={item.icon} size={20} color={active ? accentTeal : "#9ca3af"} strokeWidth={active ? 2 : 1.7} />
                {item.label}
              </button>
            );
          })}
        </nav>
      )}

      {/* ── Tweaks Panel ── */}
      <TweaksPanel>
        <TweakSection title="Accent Colors">
          <TweakColor label="Teal"   id="accentTeal"   value={accentTeal}   onChange={v => setTweak("accentTeal",   v)} />
          <TweakColor label="Violet" id="accentViolet" value={accentViolet} onChange={v => setTweak("accentViolet", v)} />
          <TweakColor label="Coral"  id="accentCoral"  value={accentCoral}  onChange={v => setTweak("accentCoral",  v)} />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakSlider label="Card Radius" id="cardRadius" value={cr} min={0} max={28} step={1} onChange={v => setTweak("cardRadius", v)} />
        </TweakSection>
        <TweakSection title="Sidebar">
          <TweakColor label="Sidebar BG" id="sidebarBg" value={sidebarBg} onChange={v => setTweak("sidebarBg", v)} />
        </TweakSection>
      </TweaksPanel>

    </div>
  );
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
(function boot(tries) {
  if (window.useTweaks) {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  } else if (tries < 100) {
    setTimeout(() => boot(tries + 1), 50);
  } else {
    document.getElementById("root").innerHTML =
      '<p style="padding:40px;color:red">Error: tweaks panel failed to load.</p>';
  }
})(0);

</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#f0f2f8"/>
    <rect width="26" height="80" fill="#1a1d27"/>
    <rect x="30" y="8" width="52" height="14" rx="4" fill="#2ec4b6" opacity="0.85"/>
    <rect x="86" y="8" width="28" height="64" rx="4" fill="#fff"/>
    <rect x="30" y="26" width="52" height="26" rx="4" fill="#fff"/>
    <rect x="30" y="56" width="24" height="16" rx="4" fill="#9b72f0" opacity="0.7"/>
    <rect x="58" y="56" width="24" height="16" rx="4" fill="#fff"/>
  </svg>
</template>
</body>
</html>
