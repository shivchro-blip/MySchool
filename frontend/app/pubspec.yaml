name: yadhum
description: AI Exam Coach for Tamil Nadu +1 and +2 students
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.0

  # UI
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  flutter_svg: ^2.0.0

  # Utils
  intl: ^0.19.0

  # Deep links / OAuth
  app_links: ^6.3.2
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/content/Class_11/English/chapters/
    - assets/content/Class_11/English/practice/
    - assets/content/Class_12/English/chapters/
    - assets/content/Class_12/English/practice/
    - assets/content/legal/
    - assets/model_papers/
