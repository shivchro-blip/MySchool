[project]
name = "exam-coach-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "supabase",
    "chromadb",
    "httpx",
    "python-multipart",
    "python-dotenv",
    "pdfplumber",
    "pymupdf",
    "langchain-text-splitters",
    "torch",
    "sentence-transformers",
    "rich",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "slowapi",
    # Security floors (pip-audit, 2026-06-10): keep transitive deps above
    # known-vulnerable versions. See SECURITY_AUDIT.md.
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "pyjwt>=2.13.0",
    "langchain-core>=1.3.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pip-audit",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
